name: Release request

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  request:
    name: Validate unprivileged release request
    runs-on: ubuntu-24.04
    steps:
      - name: Validate requested tag shape
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          semver_tag_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          [[ "$RELEASE_TAG" =~ $semver_tag_regex ]]
