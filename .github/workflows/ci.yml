name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CC_aarch64_unknown_linux_musl: musl-gcc
  CC_x86_64_unknown_linux_musl: musl-gcc

jobs:
  quality:
    name: Quality / Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Show active Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Check npm distribution contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix npm
          npm run check --prefix npm
          npm test --prefix npm

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check third-party license notices
        run: sh scripts/check-third-party-licenses.sh --check

      - name: Check release publisher context
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/check-release-workflow.sh
          sh scripts/check-npm-distribution-workflow.sh

      - name: Check RC3 public documentation
        run: sh scripts/check-rc3-public-docs.sh

      - name: Build release workspace
        run: cargo build --workspace --release --locked

  platform:
    name: Platform / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: xgeny-x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/xgeny
            npm_tarball: xgen-cli-linux-x64-musl.tgz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: xgeny-aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/xgeny
            npm_tarball: xgen-cli-linux-arm64-musl.tgz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: xgeny-x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/xgeny
            npm_tarball: xgen-cli-darwin-x64.tgz
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - os: macos-15
            target: aarch64-apple-darwin
            asset: xgeny-aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/xgeny
            npm_tarball: xgen-cli-darwin-arm64.tgz
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            asset: xgeny-x86_64-pc-windows-msvc.exe
            binary: target/x86_64-pc-windows-msvc/release/xgeny.exe
            npm_tarball: xgen-cli-win32-x64.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and release target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install musl linker
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Verify pinned Apple toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: ${{ matrix.developer_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version)" = $'Xcode 16.4\nBuild version 16F6'
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.5"

      - name: Show active Rust toolchain
        run: rustup show active-toolchain

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Lint platform-specific filesystem adapter
        run: cargo clippy --locked -p xgeny-adapter-filesystem --all-targets -- -D warnings

      - name: Lint platform-specific process adapter
        run: cargo clippy --locked -p xgeny-adapter-process --all-targets -- -D warnings

      - name: Check bundled protocol
        run: cargo run --locked --quiet -p xgeny-cli -- protocol check

      - name: Build release CLI
        env:
          DEVELOPER_DIR: ${{ matrix.developer_dir }}
        run: cargo build --locked --release -p xgeny-cli --target ${{ matrix.target }}

      - name: Audit Unix native dependencies
        if: runner.os != 'Windows'
        env:
          DEVELOPER_DIR: ${{ matrix.developer_dir }}
        shell: bash
        run: sh scripts/audit-native-binary.sh "${{ matrix.binary }}" "${{ matrix.target }}"

      - name: Audit Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/audit-native-binary.ps1 -Binary "${{ matrix.binary }}"

      - name: Stage Unix release asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          install -m 0755 "${{ matrix.binary }}" "release/${{ matrix.asset }}"

      - name: Stage Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "${{ matrix.binary }}" -Destination "release/${{ matrix.asset }}"

      - name: Pack and smoke npm global install
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix npm
          npm_output="$RUNNER_TEMP/xgeny-npm-launcher"
          mkdir -p "$npm_output"
          node npm/scripts/pack.mjs \
            --launcher \
            --output-dir "$npm_output"
          node npm/scripts/pack.mjs \
            --target "${{ matrix.target }}" \
            --binary "${{ matrix.binary }}" \
            --output-dir release
          test -f "release/${{ matrix.npm_tarball }}"
          node npm/scripts/smoke.mjs \
            --launcher "$npm_output/xgen-cli.tgz" \
            --platform "release/${{ matrix.npm_tarball }}" \
            --target "${{ matrix.target }}"

      - name: Smoke shell installer against staged asset
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/smoke-installer.sh "release/${{ matrix.asset }}" "${{ matrix.asset }}" install/xgeny-installer.sh

      - name: Smoke PowerShell installer against staged asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1 -Binary "release/${{ matrix.asset }}" -Asset "${{ matrix.asset }}" -Installer install/xgeny-installer.ps1

      - name: Smoke Windows PowerShell 5.1 installer against staged asset
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-installer.ps1 -Binary "release/${{ matrix.asset }}" -Asset "${{ matrix.asset }}" -Installer install/xgeny-installer.ps1
