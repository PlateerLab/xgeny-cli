[workspace]
members = [
    "crates/xgeny-cli",
    "crates/xgeny-domain",
    "crates/xgeny-local-store",
    "crates/xgeny-protocol",
    "crates/xgeny-runtime",
    "crates/xgeny-workgraph",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/PlateerLab/xgeny-cli"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.52.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
