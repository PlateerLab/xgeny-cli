[workspace]
members = [
    "crates/xgeny-adapter-filesystem",
    "crates/xgeny-adapter-process",
    "crates/xgeny-adapter-reference",
    "crates/xgeny-cli",
    "crates/xgeny-domain",
    "crates/xgeny-local-store",
    "crates/xgeny-policy",
    "crates/xgeny-provider-openai",
    "crates/xgeny-protocol",
    "crates/xgeny-runtime",
    "crates/xgeny-workgraph",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/PlateerLab/xgeny-cli"

[workspace.dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.6", features = ["derive", "env"] }
ctrlc = "3.5.1"
getrandom = "0.3.4"
jsonschema = { version = "0.52.0", default-features = false }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
libc = "0.2.189"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "process-group", "job-object"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
zeroize = "1.8.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
